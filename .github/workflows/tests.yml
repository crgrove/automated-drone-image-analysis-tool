name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # requirements-mac.txt is requirements.txt with the CPU onnxruntime
          # wheel; onnxruntime-directml only exists for Windows.
          - os: ubuntu-24.04
            requirements: requirements-mac.txt
          - os: windows-2025
            requirements: requirements.txt
          - os: macos-26
            requirements: requirements-mac.txt
    env:
      # Render Qt offscreen everywhere (Linux runners have no display). GitHub
      # also sets CI=true, which skips the tests that need the gitignored
      # app/tests/data (see app/tests/conftest.py).
      QT_QPA_PLATFORM: offscreen
      REQUIREMENTS: ${{ matrix.requirements }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libxcb-cursor0 libfontconfig1

      # Only the test plugins from requirements-dev.txt; pytest-cov is needed
      # because pytest.ini always passes --cov=app.
      - name: Install Python dependencies
        run: python -m pip install -r "$REQUIREMENTS" pytest-qt pytest-cov

      - name: Run tests
        run: python -m pytest app/tests -rs
